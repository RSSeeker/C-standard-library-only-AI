name: CI Build Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-mingw:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Compile with MinGW
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -Wall -mwindows -static -o ai.exe main.cpp AI.cpp -lcomctl32 -lcomdlg32

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-mingw64
          path: ai.exe

  build-msvc:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build with MSVC
        run: |
          cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-msvc
          path: build/Release/ai.exe