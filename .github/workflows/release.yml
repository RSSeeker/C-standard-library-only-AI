name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mingw:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag_name: ${{ steps.version.outputs.TAG_NAME }}
      is_prerelease: ${{ steps.version.outputs.PRERELEASE }}
      release_name: ${{ steps.version.outputs.RELEASE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            echo "TAG_NAME=${TAG}" >> "$GITHUB_OUTPUT"
            echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
            echo "RELEASE_NAME=${TAG}" >> "$GITHUB_OUTPUT"
          else
            SHA="${GITHUB_SHA::7}"
            echo "TAG_NAME=pre-${SHA}" >> "$GITHUB_OUTPUT"
            echo "VERSION=pre-${SHA}" >> "$GITHUB_OUTPUT"
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
            echo "RELEASE_NAME=Pre-release ${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - name: Compile with MinGW
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 -Wall -mwindows -static -o ai.exe main.cpp AI.cpp -lcomctl32 -lcomdlg32

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path ai.exe -DestinationPath ai-mingw64.zip

      - name: Upload MinGW artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-mingw64
          path: |
            ai.exe
            ai-mingw64.zip

  build-msvc:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build with MSVC
        run: |
          cmake --build build --config Release

      - name: Package artifact
        shell: pwsh
        run: |
          Copy-Item build/Release/ai.exe ai-msvc.exe
          Compress-Archive -Path ai-msvc.exe -DestinationPath ai-msvc.zip

      - name: Upload MSVC artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-msvc
          path: |
            ai-msvc-gui.exe
            ai-msvc-cli.exe
            ai-msvc-gui.zip
            ai-msvc-cli.zip

  release:
    needs: [build-mingw, build-msvc]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        shell: bash
        run: ls -R artifacts/

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -name "*.exe" -o -name "*.zip" | sort | while read f; do
            sha256sum "$f" >> checksums.txt
          done

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-mingw.outputs.tag_name }}
          name: ${{ needs.build-mingw.outputs.release_name }}
          prerelease: ${{ needs.build-mingw.outputs.is_prerelease }}
          body: |
            ## ${{ needs.build-mingw.outputs.version }}

            自动构建版本，由 GitHub Actions 编译并发布。

            ### 两个版本 / Two editions
            本仓库同时提供**图形界面版**与**命令行版**，二者共用同一个纯 C 引擎
            （`c/` 目录，与 Python 版数值逐位一致），模型存档格式互通。

            | 版本 | MinGW-w64（静态，无运行时依赖） | MSVC（需要 VC++ 运行库） |
            |------|--------------------------------|--------------------------|
            | **GUI 图形界面版** | `ai-mingw64-gui.zip` / `ai.exe` | `ai-msvc-gui.zip` / `ai-msvc-gui.exe` |
            | **CLI 命令行版** | `ai-mingw64-cli.zip` / `ai_cli.exe` | `ai-msvc-cli.zip` / `ai-msvc-cli.exe` |

            命令行版含 21 条子命令：`train`（含 K 折 / 网格搜索 / 蒸馏 / 早停判据）、
            `predict`、`serve`（HTTP 推理服务）、`cross-validate`、`prune`、`quantize`、
            `compare`、`export-svg`、`export-weights`（与 Python 版 JSON 互通）、
            `bench`、`plot` 等，`ai_cli help` 可看全部。

            ### 校验和
            见下方 `checksums.txt`。
          files: |
            artifacts/**/ai*.exe
            artifacts/**/ai*.zip
            artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
